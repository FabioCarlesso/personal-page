on:
  push:
    branches:
      - main
name: 🚀 Deploy my persona website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: ${{ secrets.ftp_host_personal_page }}
          username: ${{ secrets.ftp_user_personal_page }}
          password: ${{ secrets.ftp_password_personal_page }}
          server-dir: public_html/
          # Setting exclude replaces the action's defaults, so they are repeated here.
          # scripts/ holds build tooling (press kit) — committed, never served.
          exclude: "[.git*, .git*/**, node_modules/**, node_modules/**/*, scripts, scripts/**]"